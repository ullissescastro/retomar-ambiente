[package]
name = "retomar-ambiente"
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
description = "Retoma aplicativos que estavam abertos na sessão anterior do COSMIC"
repository = "https://github.com/ullissescastro/retomar-ambiente"

[dependencies]
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7", features = ["client"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "about",
    "single-instance",
    "markdown",
    "qr_code",
    "wgpu",
    "xdg-portal"
]
